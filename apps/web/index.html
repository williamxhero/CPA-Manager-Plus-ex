    <script>
      (function () {
        var iconAssets = [
          { id: 'cpamp-favicon', marker: 'favicon' },
          { id: 'cpamp-apple-touch-icon', marker: 'apple-touch-icon' }
        ];

        function useEmbeddedIcon(link) {
          var fallback = link.getAttribute('data-cpamp-fallback');
          if (fallback) link.setAttribute('href', fallback);
        }

        if (typeof window.fetch !== 'function') return;

        iconAssets.forEach(function (asset) {
          var link = document.getElementById(asset.id);
          if (!link) return;

          window
            .fetch(link.getAttribute('href'), { method: 'HEAD' })
            .then(function (response) {
              if (
                !response.ok ||
                response.headers.get('X-CPAMP-Asset') !== asset.marker
              ) {
                useEmbeddedIcon(link);
              }
            })
            .catch(function () {
              useEmbeddedIcon(link);
            });
        });
      })();
    </script>
